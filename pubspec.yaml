name: calc_triangle
description: Flutter project calculating the sides in a right triangle


publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.2.0+6

environment:
  sdk: ">=2.12.0 <3.0.0"


dependencies:
  flutter:
    sdk: flutter



  cupertino_icons: ^1.0.2
  flutter_screenutil: ^5.0.0+2

  get: ^4.3.8

  logger: ^1.1.0
  google_mobile_ads: ^1.0.0
  share: ^2.0.4
  url_launcher: ^6.0.12
  shared_preferences: ^2.0.8
  sticky_headers: ^0.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.9.2"
  flutter_native_splash: ^1.3.1


  flutter_lints: ^1.0.0


flutter:

  uses-material-design: true

  assets:

    - assets/images/triangle/
    - assets/images/triangle/right/
    - assets/images/triangle/scalene/
    - assets/images/triangle/isosceles/
    - assets/images/triangle/equilateral/

  fonts:
    - family: montserrat
      fonts:
        - asset: fonts/montserrat_light.ttf
          weight: 300
        - asset: fonts/montserrat_regular.ttf
          weight: 400
        - asset: fonts/montserrat_medium.ttf
          weight: 500
        - asset: fonts/montserrat_semibold.ttf
          weight: 600
        - asset: fonts/montserrat_bold.ttf
          weight: 700
        - asset: fonts/montserrat_mediumitalic.ttf
          style: italic
 
